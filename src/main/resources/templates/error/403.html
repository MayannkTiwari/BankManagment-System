<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Request not accepted', 'The request was not accepted, usually because the session expired.', 'noindex,nofollow')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="main">
  <div class="wrap narrow">
    <h1>Request not accepted</h1>
    <p>This usually happens when the page was left open for a long time and your session expired. Nothing was changed. Sign in again and repeat what you were doing.</p>
    <p><a class="btn" th:href="@{/login}" href="/login">Sign in</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
