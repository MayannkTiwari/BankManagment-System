<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Transfer', 'Send money to another account.', 'noindex,nofollow')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="main">
  <div class="wrap narrow">
    <h1>Transfer</h1>
    <p>Transfers cannot be reversed once they are confirmed. Check the card number before you submit.</p>
    <form class="form" th:action="@{/account/transfer}" th:object="${form}" method="post" novalidate>
      <input type="hidden" th:field="*{requestId}">
      <div class="alert" role="alert" th:if="${#fields.hasErrors('*')}">
        <p>Please correct the problems below.</p>
        <p th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</p>
      </div>
      <div class="field" th:classappend="${#fields.hasErrors('recipientCard')} ? 'has-error'">
        <label for="recipientCard">Recipient card number</label>
        <input type="text" id="recipientCard" th:field="*{recipientCard}" inputmode="numeric" maxlength="23" autocomplete="off">
        <p class="hint">The recipient's 16-digit card number.</p>
        <p class="error" th:if="${#fields.hasErrors('recipientCard')}" th:errors="*{recipientCard}">Error</p>
      </div>
      <div class="field" th:classappend="${#fields.hasErrors('amount')} ? 'has-error'">
        <label for="amount">Amount (INR)</label>
        <input type="text" id="amount" th:field="*{amount}" inputmode="decimal" autocomplete="off">
        <p class="hint">Up to <span th:text="${maxTransaction}">limit</span> per transaction.</p>
        <p class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Error</p>
      </div>
      <div class="field" th:classappend="${#fields.hasErrors('pin')} ? 'has-error'">
        <label for="pin">PIN</label>
        <input type="password" id="pin" th:field="*{pin}" inputmode="numeric" maxlength="4" autocomplete="off">
        <p class="error" th:if="${#fields.hasErrors('pin')}" th:errors="*{pin}">Error</p>
      </div>
      <button class="btn" type="submit">Send money</button>
    </form>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
